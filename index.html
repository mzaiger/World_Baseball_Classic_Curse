<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Run Derby Curse</title>
<style>
  :root {
    --green: #2e7d32;
    --yellow: #f9a825;
    --orange: #ef6c00;
    --red: #c62828;
    --na: #4a4a55;
    --bg: #12121a;
    --card: #1e1e2a;
    --text: #e8e8f0;
    --muted: #9a9ab0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  header { max-width: 760px; margin: 0 auto 28px; text-align: center; }
  h1 { font-size: 2.1rem; margin-bottom: 6px; }
  h1 .big-trophy { filter: drop-shadow(0 0 6px rgba(255,215,0,.6)); }
  .subtitle { color: var(--muted); margin-bottom: 18px; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    font-size: .82rem;
  }
  .legend span {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); padding: 5px 10px; border-radius: 20px;
    border: 1px solid #2e2e40;
  }
  .chip { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .chip.g { background: var(--green); } .chip.y { background: var(--yellow); }
  .chip.o { background: var(--orange); } .chip.r { background: var(--red); }
  .chip.n { background: var(--na); }

  main { max-width: 760px; margin: 0 auto; }
  .year-card {
    background: var(--card); border: 1px solid #2e2e40; border-radius: 12px;
    margin-bottom: 22px; overflow: hidden;
  }
  .year-header {
    background: linear-gradient(90deg, #26263a, #1e1e2a);
    padding: 10px 18px; font-size: 1.25rem; font-weight: 700;
    letter-spacing: 1px; border-bottom: 1px solid #2e2e40;
  }
  .cancelled { padding: 14px 18px; color: var(--muted); font-style: italic; }

  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); padding: 8px 6px; border-bottom: 1px solid #2e2e40;
  }
  td { padding: 7px 6px; text-align: center; border-bottom: 1px solid #26263a; }
  tr:last-child td { border-bottom: none; }

  .hr-cell { width: 27%; font-weight: 700; font-size: 1.05rem; color: #fff; position: relative; }
  .hr-cell.green  { background: var(--green); }
  .hr-cell.yellow { background: var(--yellow); color: #1a1a1a; }
  .hr-cell.orange { background: var(--orange); }
  .hr-cell.red    { background: var(--red); }
  .hr-cell.na     { background: var(--na); color: #cfcfe0; }
  .hr-cell .info-btn { background: rgba(255,255,255,.92); color: #12121a; }
  .hr-cell.yellow .info-btn { background: rgba(0,0,0,.75); color: #fff; }

  .name-cell { width: 46%; font-size: 1rem; color: var(--text); }
  .name-cell .trophy { vertical-align: -3px; margin: 0 3px; }

  .info-btn {
    width: 17px; height: 17px; border-radius: 50%; border: none;
    font-size: 11px; font-weight: 700; font-style: italic; font-family: Georgia, serif;
    cursor: pointer; margin-left: 7px; line-height: 1;
    transition: transform .12s;
  }
  .info-btn:hover { transform: scale(1.25); }

  /* Modal */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 50;
    padding: 20px;
  }
  #overlay.open { display: flex; }
  #modal {
    background: var(--card); border: 1px solid #3a3a52; border-radius: 12px;
    max-width: 420px; width: 100%; max-height: 82vh; overflow-y: auto; padding: 18px;
  }
  #modal h2 { font-size: 1.05rem; margin-bottom: 4px; }
  #modal .modal-sub { color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
  #modal table { border: 1px solid #2e2e40; border-radius: 8px; overflow: hidden; }
  #modal td { text-align: left; padding: 5px 10px; font-size: .85rem; }
  #modal td:first-child { color: var(--muted); text-transform: capitalize; }
  #modal td:last-child { text-align: right; font-weight: 600; }
  #modal-close {
    float: right; background: none; border: none; color: var(--muted);
    font-size: 1.3rem; cursor: pointer;
  }
  #modal-close:hover { color: #fff; }

  .loading, .error { text-align: center; color: var(--muted); padding: 40px 10px; }
  .error { color: #ff8a80; }
  .error code { background: #26263a; padding: 2px 6px; border-radius: 4px; color: #ffd54f; }

  .stale-banner {
    display: none;
    max-width: 760px; margin: 0 auto 18px;
    background: rgba(198,40,40,.15); border: 1px solid var(--red);
    color: #ffb4ae; border-radius: 10px;
    padding: 10px 16px; font-size: .85rem; text-align: center;
  }
  .stale-banner.show { display: block; }
</style>
</head>
<body>

<header>
  <h1><span class="big-trophy">🏆</span> Home Run Derby Curse</h1>
  <p class="subtitle">Does winning (or just entering) the Derby wreck a hitter's swing? First-half HR vs. second-half HR for every contestant.</p>
  <div class="legend">
    <span><i class="chip g"></i> 2nd half ≥ 1st half (no curse)</span>
    <span><i class="chip y"></i> 66–99% of 1st half</span>
    <span><i class="chip o"></i> 33–66% of 1st half</span>
    <span><i class="chip r"></i> 0–33% of 1st half (cursed)</span>
    <span><i class="chip n"></i> No split data available</span>
  </div>
</header>

<div id="staleBanner" class="stale-banner"></div>

<main id="content"><div class="loading">Loading data…</div></main>

<div id="overlay">
  <div id="modal">
    <button id="modal-close">✕</button>
    <h2 id="modal-title"></h2>
    <div class="modal-sub" id="modal-sub"></div>
    <table><tbody id="modal-body"></tbody></table>
  </div>
</div>

<script>
const TROPHY_SVG = color =>
  `<svg class="trophy" width="18" height="18" viewBox="0 0 24 24" fill="${color}" title="">` +
  `<path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>`;

const GOLD = "#FFD700", SILVER = "#C0C0C0";

// Normalize names: trim, lowercase, strip accents & punctuation so
// "Teoscar Hernández" matches "Teoscar Hernandez", "Cal Ripken, Jr." etc.
function norm(s) {
  return (s || "").toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]/gi, "")
    .replace(/\s+/g, " ").trim().toLowerCase();
}
const asArray = v => v == null ? [] : (Array.isArray(v) ? v : [v]);
const prettyKey = k => k.replace(/([A-Z])/g, " $1").toLowerCase();

let splitIndex = {};   // "year|normname" -> record

// Days after which a missed daily update is treated as "API may be down"
// rather than just today's cron job not having run yet.
const STALE_THRESHOLD_DAYS = 2;

function checkFreshness(lastUpdated) {
  const banner = document.getElementById("staleBanner");
  if (!lastUpdated) return;

  const last = new Date(lastUpdated + "T00:00:00Z");
  const today = new Date();
  const todayUTC = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()));
  const daysSince = Math.round((todayUTC - last) / 86400000);

  if (daysSince >= STALE_THRESHOLD_DAYS) {
    banner.textContent =
      `⚠️ API may be down — stats hasn't updated in ${daysSince} days (last update: ${lastUpdated}).`;
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }
}

function secondHalfClass(first, second) {
  if (first == null || second == null) return "na";
  if (second >= first) return "green";   // equal or greater
  if (first === 0) return "green";       // anything >= 0
  const ratio = second / first;
  if (ratio >= 0.66) return "yellow";
  if (ratio >= 0.33) return "orange";
  return "red";
}

function buildHalfCell(rec, half) {
  const stat = rec ? rec[half] : null;
  const hr = (stat && stat.homeRuns != null) ? stat.homeRuns : null;
  const td = document.createElement("td");
  td.className = "hr-cell";

  if (hr == null) {
    td.classList.add("na");
    td.innerHTML = `<span>–</span>`;
    return td;
  }
  td.classList.add(half === "1st_half" ? "green" : secondHalfClass(rec["1st_half"]?.homeRuns ?? null, hr));
  const num = document.createElement("span");
  num.textContent = hr;
  td.appendChild(num);

  const btn = document.createElement("button");
  btn.className = "info-btn";
  btn.textContent = "i";
  btn.title = "View all " + (half === "1st_half" ? "1st" : "2nd") + " half stats";
  btn.addEventListener("click", () => openModal(rec, half));
  td.appendChild(btn);
  return td;
}

function openModal(rec, half) {
  const stat = rec[half] || {};
  const halfLabel = half === "1st_half" ? "1st Half (Pre All-Star)" : "2nd Half (Post All-Star)";
  document.getElementById("modal-title").textContent = `${rec.derby_name.trim()} — ${rec.year}`;
  document.getElementById("modal-sub").textContent = halfLabel +
    (rec.api_name && rec.api_name.trim() !== rec.derby_name.trim()
      ? "  ·  MLB API: " + rec.api_name.trim() : "");
  const body = document.getElementById("modal-body");
  body.innerHTML = "";
  const keys = Object.keys(stat);
  if (!keys.length) {
    body.innerHTML = `<tr><td colspan="2">No stats available.</td></tr>`;
  } else {
    keys.forEach(k => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.textContent = prettyKey(k);
      const td2 = document.createElement("td"); td2.textContent = stat[k];
      tr.appendChild(td1); tr.appendChild(td2);
      body.appendChild(tr);
    });
  }
  document.getElementById("overlay").classList.add("open");
}
document.getElementById("modal-close").addEventListener("click",
  () => document.getElementById("overlay").classList.remove("open"));
document.getElementById("overlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove("open");
});

function render(contestants) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  const years = [...contestants.contestants_by_year].sort((a, b) => b.year - a.year);

  for (const y of years) {
    const card = document.createElement("section");
    card.className = "year-card";
    const header = document.createElement("div");
    header.className = "year-header";
    header.textContent = y.year;
    card.appendChild(header);

    if (!y.contestants || !y.contestants.length) {
      const div = document.createElement("div");
      div.className = "cancelled";
      div.textContent = "Cancelled — no Derby held this year.";
      card.appendChild(div);
      content.appendChild(card);
      continue;
    }

    const winners = new Set(asArray(y.winner).map(norm));
    const runners = new Set(asArray(y.runner_up).map(norm));

    // Build rows, keeping original order as final tiebreaker
    let rows = y.contestants.map((name, i) => {
      const key = y.year + "|" + norm(name);
      return {
        name, i,
        rec: splitIndex[key] || null,
        winner: winners.has(norm(name)),
        runner: runners.has(norm(name))
      };
    });
    // Winner(s) first, runner(s)-up second, then anything
    rows.sort((a, b) => (b.winner - a.winner) || (b.runner - a.runner) || (a.i - b.i));

    const table = document.createElement("table");
    table.innerHTML =
      `<thead><tr><th>1st Half HR</th><th>Player</th><th>2nd Half HR</th></tr></thead>`;
    const tbody = document.createElement("tbody");

    for (const r of rows) {
      const tr = document.createElement("tr");

      tr.appendChild(buildHalfCell(r.rec, "1st_half"));

      const nameTd = document.createElement("td");
      nameTd.className = "name-cell";
      let icons = "";
      if (r.winner) icons += `<span title="Winner">${TROPHY_SVG(GOLD)}</span>`;
      if (r.runner) icons += `<span title="Runner-up">${TROPHY_SVG(SILVER)}</span>`;
      nameTd.innerHTML = icons;
      nameTd.appendChild(document.createTextNode(r.name.trim()));
      tr.appendChild(nameTd);

      tr.appendChild(buildHalfCell(r.rec, "2nd_half"));
      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    card.appendChild(table);
    content.appendChild(card);
  }
}

(async function init() {
  const content = document.getElementById("content");
  try {
    const [contestants, splitsData] = await Promise.all([
      fetch("Contestants.json?t=" + Date.now()).then(r => { if (!r.ok) throw new Error("Contestants.json"); return r.json(); }),
      fetch("derby_splits.json?t=" + Date.now()).then(r => { if (!r.ok) throw new Error("derby_splits.json"); return r.json(); })
    ]);

    // derby_splits.json is {"last_updated": "YYYY-MM-DD", "results": [...]}.
    // Fall back gracefully if an old bare-array file is ever served.
    const splits = Array.isArray(splitsData) ? splitsData : (splitsData.results || []);
    checkFreshness(Array.isArray(splitsData) ? null : splitsData.last_updated);

    // Index split records by year + normalized name (derby name, with API name as fallback)
    for (const rec of splits) {
      const yr = parseInt(rec.year, 10);
      if (rec.derby_name) splitIndex[yr + "|" + norm(rec.derby_name)] = rec;
      if (rec.api_name) {
        const k = yr + "|" + norm(rec.api_name);
        if (!splitIndex[k]) splitIndex[k] = rec;
      }
    }
    render(contestants);
  } catch (err) {
    content.innerHTML =
      `<div class="error">Could not load ${err.message}.<br><br>` +
      `Make sure both JSON files are in the same folder as this page, and serve it over HTTP, e.g.:<br>` +
      `<code>python -m http.server 8000</code> &nbsp;then open&nbsp; <code>http://localhost:8000</code></div>`;
  }
})();
</script>
</body>
</html>
